<text x="580" y="700" text-anchor="start" font-size="15" font-weight="400" fill="#333A44">• Väljundi G-d (paremal) → dashi L3 GND.</text>
<text x="40" y="728" text-anchor="start" font-size="15" font-weight="400" fill="#333A44">• V1–V3 on väljundid: tuli põleb → Vx madal (0 V).</text>
<text x="580" y="728" text-anchor="start" font-size="15" font-weight="400" fill="#333A44">• 3,3 V annab dashi GPIO pull-up – plaadile toidet ei anta.</text>
<text x="40" y="756" text-anchor="start" font-size="15" font-weight="400" fill="#333A44">• Hüppajad ära võetud: auto ja dash on eraldatud.</text>
<text x="580" y="756" text-anchor="start" font-size="15" font-weight="400" fill="#333A44">• Kanal 4 (IN4 / V4) jääb varuks.</text>
