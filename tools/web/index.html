<style>
  :root { --bg:#0b0d10; --panel:#14181d; --line:#262c34; --text:#e8ecf0; --dim:#8a94a1; --acc:#00d4ff; --on:#22e06b; --warn:#ff4d4d; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 -apple-system, system-ui, sans-serif;
         display:flex; flex-direction:column; align-items:center; gap:10px; padding:12px 16px; height:100vh; height:100dvh;
         overflow:hidden; }
  /* ekraan võtab kogu ülejäänud kõrguse; suurus arvutatakse fit() funktsioonis */
  .stage { flex:1 1 0; min-height:120px; width:100%; display:flex; align-items:center; justify-content:center; }
  h1 { font-size:17px; font-weight:600; margin:0; color:var(--dim); letter-spacing:.04em; display:flex; align-items:center; gap:10px; }

  canvas { display:block; border-radius:4px; cursor:pointer; touch-action:none;
           image-rendering:auto; transition:filter .15s; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px;
           padding:8px 14px; font:inherit; cursor:pointer; }
  button:hover { border-color:#3a4350; }
  button.on { border-color:var(--on); color:var(--on); }
  button.alert { border-color:var(--warn); color:var(--warn); }
  kbd { font:12px ui-monospace, monospace; background:#20252c; border-radius:4px; padding:1px 5px; color:var(--dim); margin-left:6px; }
  .help { color:var(--dim); font-size:12.5px; max-width:1060px; text-align:center; line-height:1.35; }
  .help a { color:var(--acc); }
  @media (max-height: 560px) { .help { display:none; } h1 img { height:30px; } }
  @media (hover: none) { kbd { display:none; } }
  @media (max-width: 520px) { h1 { font-size:13px; } h1 img { height:30px; } button { padding:6px 10px; font-size:14px; } }
  #status { color:var(--dim); font-size:13px; min-height:1.4em; }

<div class="stage" id="stage"><div class="bezel"><canvas id="c" width="1024" height="600"></canvas></div></div>
<div class="bar">
  <button id="prev">◀ Eelmine vaade<kbd>←</kbd></button>
  <button id="next">Järgmine vaade ▶<kbd>→</kbd></button>
  <button id="demo">Demo sõit<kbd>D</kbd></button>
  <button id="can">CAN ühendus<kbd>C</kbd></button>
  <button id="hot">Vesi kuumeneb üle<kbd>H</kbd></button>
</div>
<div id="status">laadin…</div>
<div class="help">Sama kood, mis jookseb päris dashi plaadil (ESP32-P4), siin brauseris (WebAssembly). Hiir = puuteekraan: <b>libista</b> vasakule/paremale = vaade · <b>klõps</b> = heledus ·
  <b>hoia 3 s</b> = demorežiim · ANDMED vaates „NULLI TIPUD“ nupp töötab klõpsuga. · <a href="https://github.com/1mreausta/SimplDash">GitHub</a></div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const img = ctx.createImageData(1024, 600), px = new Uint32Array(img.data.buffer);
const st = document.getElementById('status');
const PAGES = ['RACE', 'KELLAD', 'KAAR', 'TÄNAV', 'ANDMED'];
let down = false, lastFrame = 0, fps = 0, frames = 0, last = performance.now();

/* RGB565 -> RGBA */
const R5 = new Uint8Array(32), G6 = new Uint8Array(64);
for (let i = 0; i < 32; i++) R5[i] = (i * 527 + 23) >> 6;
for (let i = 0; i < 64; i++) G6[i] = (i * 259 + 33) >> 6;

var Module = {
  onRuntimeInitialized() { st.textContent = 'käivitan…'; requestAnimationFrame(draw); },
  print: t => console.log(t), printErr: t => console.warn(t),
};

function draw() {
  const n = Module._sim_frame_no();
  if (n !== lastFrame) {
    lastFrame = n;
    const s = new Uint16Array(Module.HEAPU16.buffer, Module._sim_fb(), 1024 * 600);
    for (let i = 0; i < s.length; i++) {
      const v = s[i];
      px[i] = 0xff000000 | (R5[v & 31] << 16) | (G6[(v >> 5) & 63] << 8) | R5[v >> 11];
    }
    ctx.putImageData(img, 0, 0);
    frames++;
  }
  const state = Module._sim_state();
  const bright = state >> 8, page = (state >> 4) & 15;
  cv.style.filter = 'brightness(' + (0.25 + 0.75 * bright / 100) + ')';
  set('demo', state & 1, 'on'); set('can', state & 2, 'on'); set('hot', state & 4, 'alert');
  const now = performance.now();
  if (now - last > 1000) { fps = frames; frames = 0; last = now; }
  st.textContent = 'vaade: ' + (PAGES[page] || page) + ' · heledus ' + bright + ' % · ' + fps + ' kaadrit/s';
  requestAnimationFrame(draw);
}
function set(id, on, cls) { document.getElementById(id).classList.toggle(cls, !!on); }

function pos(e) {
  const r = cv.getBoundingClientRect();
  return [Math.round((e.clientX - r.left) * 1024 / r.width), Math.round((e.clientY - r.top) * 600 / r.height)];
}
function send(e, p) { if (!Module._sim_pointer) return; const [x, y] = pos(e); Module._sim_pointer(x, y, p); }
cv.addEventListener('pointerdown', e => { down = true; cv.setPointerCapture(e.pointerId); send(e, 1); });
cv.addEventListener('pointermove', e => { if (down) send(e, 1); });
cv.addEventListener('pointerup', e => { if (down) { down = false; send(e, 0); } });
cv.addEventListener('pointercancel', e => { if (down) { down = false; send(e, 0); } });

const KEYS = { next: 1, prev: 2, demo: 3, can: 4, hot: 5 };
const key = k => Module._sim_key && Module._sim_key(KEYS[k]);
for (const id of ['prev', 'next', 'demo', 'can', 'hot']) document.getElementById(id).onclick = () => key(id);
addEventListener('keydown', e => {
  const m = { ArrowLeft: 'prev', ArrowRight: 'next', d: 'demo', D: 'demo', c: 'can', C: 'can', h: 'hot', H: 'hot' }[e.key];
  if (m) { e.preventDefault(); key(m); }
});

/* mahuta ekraan aknasse ilma kerimiseta (säilita 1024:600) */
function fit() {
  const st = document.getElementById('stage'), bz = cv.parentElement;
  const pad = bz.offsetWidth - bz.clientWidth + parseFloat(getComputedStyle(bz).paddingLeft) * 2;
  const w = Math.max(160, Math.min(st.clientWidth - pad, (st.clientHeight - pad) * 1024 / 600, 1400));
  cv.style.width = Math.floor(w) + 'px';
  cv.style.height = Math.floor(w * 600 / 1024) + 'px';
}
addEventListener('resize', fit);
fit();
</script>
<script src="simpldash.js"></script>
</body>
</html>
